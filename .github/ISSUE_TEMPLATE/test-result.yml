# Generated by scripts/sync-issue-form.ts from participants/ and catalog.json. Do not edit by hand.
name: Test result
description: Record one test run between a Verifier (an EHR check-in page, portal, kiosk, or clinic app) and a wallet.
title: "[result] "
labels: ["result"]
body:
  - type: markdown
    attributes:
      value: >-
        One issue per run. File failures too; discuss them in the comments.
        Close the issue to withdraw the result.
        The minimum scenarios are described at https://smart-health-checkin.org/connectathon/#minimum-scenarios,
        and the others at https://smart-health-checkin.org/connectathon/advanced.html.
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      options:
        - "share-records: Share records"
        - "fill-form: Fill in a form"
        - "decline-item: Decline one item"
        - "any-us-core: Anything in US Core"
        - "large-response: Large response"
        - "decline-all: Decline every item"
        - "form-by-reference: Form by reference only"
        - "versioned-canonical: Versioned form canonical"
        - "physician-form: Physician-authored form"
        - "narrowed-family: Narrowed profile family"
        - "no-selector: No selector"
        - "health-card: SMART Health Card"
        - "insurance-card: Insurance card as a SMART Health Card"
        - "shared-artifact: One artifact for two items"
        - "cross-device: Cross-device"
        - "in-person-handoff: In-person handoff"
        - "prefilled-form: Prefilled form"
        - "write-back: Write back"
        - "unknown-selector: Unknown selector"
        - "Other (say which in the note)"
    validations:
      required: true
  - type: dropdown
    id: verifier
    attributes:
      label: Verifier
      description: The side that asked for data. EHR check-in pages, patient portals, kiosks, and clinic apps are Verifiers.
      options:
        - "Apex Nexus check-in (Parker Health, apex-nexus-checkin)"
        - "Comanage Check-in Kiosk (Healthcare Registries, LLC, comanage-kiosk)"
        - "Comanage SMART Health Check-in (Healthcare Registries, LLC, comanage)"
        - "Example native Verifier app (SMART Health IT, smart-verifier-app)"
        - "Foo Medical (Medplum, medplum-foo-medical)"
        - "RX Genie (FHIR IQ, fhir-iq-rxgenie)"
        - "Testing EHR (SMART Health IT, smart-testing-ehr)"
        - "Other (say which in the note)"
    validations:
      required: true
  - type: dropdown
    id: wallet
    attributes:
      label: Wallet
      options:
        - "bwell-wallet (Bwell, bwell-wallet)"
        - "CareAgents (FHIR IQ, fhir-iq-careagents)"
        - "Flexpa Health Wallet (Flexpa, flexpa)"
        - "haau3 Web Wallet (haau3, haau3)"
        - "HealthScores.ai wallet (HealthScores.ai by zPaper, healthscores-ai-by-zpaper-healthscores-ai-wallet)"
        - "HealthWallet.me (Android) (HealthWallet.me by Life Value, healthwallet-me-android)"
        - "HealthWallet.me (iOS) (HealthWallet.me by Life Value, healthwallet-me-ios)"
        - "M5 Whole Health (M5 Whole Health, m5-whole-health)"
        - "MyDigiRecords Health Wallet (Android) (MyDigiRecords, mydigirecords-mydigirecords-health-wallet-android)"
        - "MyDigiRecords Health Wallet (iOS) (MyDigiRecords, mydigirecords-mydigirecords-health-wallet-ios)"
        - "MyDigiRecords Health Wallet (MyDigiRecords, mydigirecords-health-wallet)"
        - "SereniCare AI KTC (SereniCare AI, serenicare-ai-ktc)"
        - "SMART reference Android wallet (SMART Health IT, smart-android-wallet)"
        - "SMART Testing Wallet (SMART Health IT, smart-testing-wallet)"
        - "Tula (RealActivity, realactivity-tula)"
        - "UHC Smart Wallet (UnitedHealth Group, uhc-smart-wallet)"
        - "Well (Well App by BairWise, well-wallet)"
        - "Other (say which in the note)"
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Path
      description: How the Verifier reached the wallet. A web wallet opens in a tab from the Verifier's wallet list; a native wallet is an app reached through the phone's wallet chooser.
      options:
        - "web wallet"
        - "native wallet"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "pass"
        - "fail"
        - "blocked"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS, and browser
      placeholder: "Pixel 8, Android 16, Chrome 141"
  - type: textarea
    id: note
    attributes:
      label: Note
      description: What happened. For a failure, what you expected and what you saw.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste a testing tool log, or attach screenshots and captured requests and responses.
