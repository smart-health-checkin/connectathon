# Generated by scripts/sync-issue-form.ts from participants/ and catalog.json. Do not edit by hand.
name: Test result
description: Record one test run between a Verifier (an EHR check-in page, portal, kiosk, or clinic app) and a wallet.
title: "[result] "
labels: ["result"]
body:
  - type: markdown
    attributes:
      value: >-
        One issue per run. File failures too; discuss them in the comments.
        Close the issue to withdraw the result.
        Scenarios are described at https://smart-health-checkin.org/connectathon/scenarios.html.
  - type: dropdown
    id: scenario
    attributes:
      label: Scenario
      options:
        - "M1 Web wallet from the registry"
        - "M2 Native wallet through the Digital Credentials API"
        - "M3 Insurance"
        - "M4 Pre-visit questionnaire, inline"
        - "M5 One item declined"
        - "M6 Nothing to share"
        - "L1 Anything in USCDI, small patient"
        - "L2 Anything in USCDI, large patient"
        - "O1 Questionnaire by reference only"
        - "O2 Versioned canonical"
        - "O3 Physician-authored form"
        - "O4 Narrowed family"
        - "O5 No selector"
        - "O6 SMART Health Card"
        - "O7 One artifact, several items"
        - "O8 Cross-device"
        - "O9 In-person handoff"
        - "O10 Prefilled form"
        - "O11 Write back"
        - "O12 Unknown selector"
        - "Other (say which in the note)"
    validations:
      required: true
  - type: dropdown
    id: verifier
    attributes:
      label: Verifier
      description: The side that asked for data. EHR check-in pages, patient portals, kiosks, and clinic apps are Verifiers.
      options:
        - "Reference clinic check-in page (SMART Health IT, smart-reference-ehr)"
        - "Testing EHR (SMART Health IT, smart-testing-ehr)"
        - "Other (say which in the note)"
    validations:
      required: true
  - type: dropdown
    id: wallet
    attributes:
      label: Wallet
      options:
        - "Flexpa Health Wallet (Flexpa, flexpa)"
        - "SMART reference Android wallet (SMART Health IT, smart-android-wallet)"
        - "SMART Testing Wallet (SMART Health IT, smart-testing-wallet)"
        - "Other (say which in the note)"
    validations:
      required: true
  - type: dropdown
    id: path
    attributes:
      label: Path
      options:
        - "web"
        - "native"
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - "pass"
        - "fail"
        - "blocked"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device, OS, and browser
      placeholder: "Pixel 8, Android 16, Chrome 141"
  - type: textarea
    id: note
    attributes:
      label: Note
      description: What happened. For a failure, what you expected and what you saw.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste a testing tool log, or attach screenshots and captured requests and responses.
